publications:
  - title: "Adaptation Potential of Local Water Management Practices to Glacier Loss"
    authors: "Gimeno Jésus, C., Cuadros-Adriazola, J., Moulds, S., et al."
    year: 2026
    journal: "Earth's Future"
    volume: "14"
    doi: "10.1029/2026EF008697"
    url: "https://doi.org/10.1029/2026EF008697"
    description: "As glaciers shrink, mountain catchments and the livelihoods that depend on them are losing an important source of water storage. This paper explores how local water management practices can complement large-scale infrastructure to support climate adaptation across Peru's Vilcanota-Urubamba basin."
    image: "/assets/img/highlights/GimenoJesus2026.jpg"

  - title: "Coproduced assessments of climate change adaptation reveal equity challenges in locally led approaches"
    authors: "Howard, B.C., Awuni, C., Agyei-Mensah, S., et al."
    year: 2026
    journal: "Environmental Research Letters"
    volume: "21"
    doi: "10.1088/1748-9326/ae63e5"
    url: "https://doi.org/10.1088/1748-9326/ae63e5"
    description: "Researchers from ICHydro, working closely in international and interdisciplinary teams, have developed a new co-produced approach to quantitatively assess climate change adaptation using local knowledge and priorities, applying it to flood risk in Tamale, Ghana. The study found that community-led and behavioural measures, such as collective action and tree planting, were the most effective at reducing flood risk overall, while also highlighting that current locally led adaptation efforts do not fully address existing inequalities."
    image: "/assets/img/highlights/Howard2026.jpg"

  - title: "The long-term hazard cascade of an unprecedented wildfire in a tropical mountain ecosystem"
    authors: "Veness, W., Day, M., Ross, A.C., et al."
    year: 2026
    journal: "Natural Hazards and Earth System Sciences"
    volume: "26"
    doi: "https://doi.org/10.5194/nhess-26-3045-2026"
    url: "https://nhess.copernicus.org/articles/26/3045/2026/"
    description: "Communities in the lowlands of the Rwenzori Mountains have been exposed to a series of cascading hazards including flooding, landslides, erosion and water pollution following an unprecedented 2012 wildfire in the high mountains. Here, our team analyses the long-term cascade which followed the wildfire, highlighting the emergent risk of high-mountain tropical fires as a priority for disaster management."
    image: "/assets/img/highlights/Veness2026.jpg"
  
  - title: "Spatial Patterns of Glacier-Wetland Hydrological Connectivity in the Rapidly Deglaciating Peruvian Andes"
    authors: "Xuan, D., Becker, R., Vargas Valverde, M., et al."
    year: 2026
    journal: "Earth's Future"
    volume: "14"
    doi: "https://doi.org/10.1029/2026EF008149"
    url: "https://agupubs.onlinelibrary.wiley.com/doi/10.1029/2026EF008149"
    description: "A study to investigate the role of glacier-wetland hydrological connectivity in sustaining high-altitude wetlands in the Peruvian Andes."
    image: "/assets/img/highlights/Xuan2026.jpeg"
